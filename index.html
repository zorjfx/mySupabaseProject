<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Статусы группы</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial,sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg,#f3f6ff,#eef2f7);
      color: #151515;
      display: flex;
      justify-content: center;
      padding: 18px 10px;
    }

    .app {
      width: 100%;
      max-width: 440px;
    }

    .top-label {
      color: #6f63ff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 22px;
      font-weight: 900;
    }

    h1 span {
      color: #6f63ff;
    }

    .card {
      background: rgba(255,255,255,0.95);
      border: 1px solid #e3e6ef;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 12px 35px rgba(50,70,100,0.08);
    }

    .small-title {
      font-size: 12px;
      color: #747b91;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .center {
      text-align: center;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .timer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 42px;
      font-weight: 900;
      color: #35cdb2;
      margin: 18px 0 8px;
    }

    .session-status {
      color: #ffb020;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 13px 8px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-green {
      background: #4bd7b7;
      color: #063b32;
    }

    .btn-red {
      background: #ff5d63;
      color: white;
    }

    .btn-gray {
      background: #e8ebf2;
      color: #73798a;
    }

    .btn-blue {
      background: #6f63ff;
      color: white;
      width: 100%;
    }

    .profile-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #74b83f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #35cdb2;
      font-size: 14px;
      font-weight: 800;
      margin-top: 3px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #35cdb2;
      flex-shrink: 0;
    }

    .status-colored {
      font-weight: 900;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .badge {
      background: #eefbf8;
      border: 1px solid #bceee4;
      color: #169a82;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
      margin-top: 18px;
      border-top: 1px solid #e5e7ef;
      padding-top: 16px;
      text-align: center;
    }

    .stat-number {
      color: #35cdb2;
      font-size: 18px;
      font-weight: 900;
    }

    .stat-label {
      font-size: 10px;
      color: #747b91;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .goal-box {
      margin-top: 16px;
      background: #f8f9fd;
      border: 1px solid #e4e7f0;
      border-radius: 14px;
      padding: 14px;
    }

    .goal-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 8px;
      margin-top: 10px;
    }

    .progress {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e8ebf2;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #6f63ff;
      border-radius: 999px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 14px;
    }

    .status-btn {
      background: white;
      border: 1px solid #e0e4ef;
      color: #1d2230;
      text-align: left;
      padding-left: 15px;
    }

    .status-btn.active {
      border-color: #6f63ff;
      background: #f5f3ff;
      box-shadow: 0 0 0 2px rgba(111,99,255,0.18);
      color: #1d2230;
    }

    .group-list,.ranking-list,.notes-list,.help-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .user-item,.rank-item,.note-item,.help-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8f9fd;
      border: 1px solid #e8ebf2;
      border-radius: 14px;
      padding: 12px;
    }

    .note-item,.help-item {
      display: block;
    }

    .user-main,.rank-main {
      flex: 1;
      min-width: 0;
    }

    .user-title,.rank-title,.note-title,.help-title {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub,.rank-sub,.note-sub,.help-sub {
      font-size: 12px;
      color: #747b91;
      font-weight: 700;
      margin-top: 3px;
    }

    .place {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #edf0f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #6f63ff;
    }

    .rank-score {
      text-align: right;
      color: #35cdb2;
      font-weight: 900;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-bottom: 14px;
    }

    .tab {
      background: #f8f9fd;
      border: 1px solid #e5e7ef;
      color: #747b91;
      padding: 12px 6px;
    }

    .tab.active {
      background: #6f63ff;
      color: white;
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .achievement {
      background: #f8f9fd;
      border: 1px solid #e4e7f0;
      border-radius: 14px;
      padding: 13px;
      min-height: 125px;
    }

    .achievement.locked {
      opacity: 0.45;
      filter: grayscale(1);
    }

    .ach-emoji {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .ach-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .ach-desc {
      color: #747b91;
      font-size: 11px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .rarity {
      display: inline-block;
      background: #eaf7f4;
      color: #15967e;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .chat-box {
      height: 210px;
      border: 1px solid #e4e7f0;
      background: #f8f9fd;
      border-radius: 14px;
      padding: 14px;
      overflow-y: auto;
      margin-bottom: 10px;
      line-height: 1.35;
      font-size: 14px;
    }

    .message {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eceff6;
    }

    .message strong {
      font-weight: 900;
    }

    .like-btn {
      margin-top: 5px;
      padding: 5px 8px;
      font-size: 12px;
      background: #eefbf8;
      color: #169a82;
      border: 1px solid #bceee4;
    }

    .chat-form,.note-form,.help-form {
      display: grid;
      grid-template-columns: 1fr 56px;
      gap: 8px;
      margin-top: 10px;
    }

    input {
      border: 1px solid #e0e4ef;
      background: white;
      border-radius: 11px;
      padding: 14px;
      outline: none;
      font-size: 15px;
      width: 100%;
    }

    .send-btn {
      background: #35cdb2;
      color: white;
      font-size: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top-label">Realtime Monitor</div>
    <h1>Статусы <span>группы</span></h1>

    <div class="card center" id="loginCard">
      <div class="profile-name">Войдите в аккаунт</div>
      <button class="btn-blue" id="loginBtn">Войти через Google</button>
    </div>

    <div id="mainApp" class="hidden">
      <div class="card center">
        <div class="small-title">Сессия учёбы</div>
        <div class="profile-name" id="sessionName">...</div>

        <div class="timer">
          <span>⏱️</span>
          <span id="timerText">0 сек.</span>
        </div>

        <div class="session-status" id="sessionStatus">В сети</div>

        <div class="buttons">
          <button class="btn-green" id="continueBtn">▶ Продолжить</button>
          <button class="btn-red" id="finishBtn">■ Завершить</button>
          <button class="btn-gray" id="logoutBtn">Выход</button>
        </div>
      </div>

      <div class="card">
        <div class="small-title">Ваш профиль</div>

        <div class="profile-row">
          <div class="avatar" id="avatarBox">A</div>

          <div>
            <div class="profile-name" id="profileName">...</div>
            <div class="online">
              <span class="dot" id="profileDot"></span>
              <span id="profileStatus">В сети</span>
            </div>
            <div class="badges" id="profileBadges"></div>
          </div>
        </div>

        <div class="stats">
          <div>
            <div class="stat-number" id="statStudy">0с</div>
            <div class="stat-label">Учёба</div>
          </div>
          <div>
            <div class="stat-number" id="statSessions">0</div>
            <div class="stat-label">Сессий</div>
          </div>
          <div>
            <div class="stat-number" id="statMessages">0</div>
            <div class="stat-label">Сообщ.</div>
          </div>
          <div>
            <div class="stat-number" id="statAchievements">0</div>
            <div class="stat-label">Достиж.</div>
          </div>
        </div>

        <div class="goal-box">
          <div class="small-title">Цель учёбы</div>
          <div id="goalText">0с / 0с</div>
          <div class="progress">
            <div class="progress-fill" id="goalProgress"></div>
          </div>

          <div class="goal-row">
            <input id="goalInput" type="number" min="1" placeholder="Минуты цели" />
            <button class="btn-blue" id="saveGoalBtn">OK</button>
          </div>
        </div>
      </div>

      <div class="status-grid">
        <button class="status-btn" data-status="В сети" onclick="setStatus('В сети','#35cdb2')">🟢 В сети</button>
        <button class="status-btn" data-status="Отошёл" onclick="setStatus('Отошёл','#ffb020')">🟡 Отошёл</button>
        <button class="status-btn" data-status="Занят" onclick="setStatus('Занят','#ff5d63')">🔴 Занят</button>
        <button class="status-btn" data-status="Не беспокоить" onclick="setStatus('Не беспокоить','#111111')">⚫ Не беспокоить</button>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab active" onclick="showTab('participants')">👥 Участники</button>
          <button class="tab" onclick="showTab('ranking')">🏆 Рейтинг</button>
          <button class="tab" onclick="showTab('achievements')">🎖️ Достижения</button>
        </div>

        <div id="participantsTab">
          <div class="small-title">Монитор группы</div>
          <div class="group-list" id="groupList"></div>
        </div>

        <div id="rankingTab" class="hidden">
          <div class="small-title">Топ студентов</div>
          <div class="ranking-list" id="rankingList"></div>
        </div>

        <div id="achievementsTab" class="hidden">
          <div class="small-title">Все достижения</div>
          <div class="achievements-grid" id="achievementsList"></div>
        </div>
      </div>

      <div class="card">
        <div class="small-title">Заметки учёбы</div>
        <div class="notes-list" id="notesList"></div>

        <form class="note-form" id="noteForm">
          <input id="noteInput" placeholder="Например: учу SQL..." autocomplete="off" />
          <button class="send-btn" type="submit">+</button>
        </form>
      </div>

      <div class="card">
        <div class="small-title">Помощь группе</div>
        <div class="help-list" id="helpList"></div>

        <form class="help-form" id="helpForm">
          <input id="helpInput" placeholder="С чем нужна помощь?" autocomplete="off" />
          <button class="send-btn" type="submit">?</button>
        </form>
      </div>

      <div class="card">
        <div class="small-title">Общий чат</div>

        <div class="chat-box" id="chatBox"></div>

        <form class="chat-form" id="chatForm">
          <input id="messageInput" placeholder="Сообщение..." autocomplete="off" />
          <button class="send-btn" type="submit">➤</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://mpmwudnorlysdgnyflrp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HfwxbHwvxSHEe7xgrtAbsQ_BDChDIde";

    const supabase = createClient(SUPABASE_URL,SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = null;
    let myAchievements = [];
    let allAchievements = [];
    let myLikes = [];
    let timerInterval = null;

    const loginCard = document.getElementById("loginCard");
    const mainApp = document.getElementById("mainApp");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const continueBtn = document.getElementById("continueBtn");
    const finishBtn = document.getElementById("finishBtn");
    const saveGoalBtn = document.getElementById("saveGoalBtn");

    const sessionName = document.getElementById("sessionName");
    const timerText = document.getElementById("timerText");
    const sessionStatus = document.getElementById("sessionStatus");

    const profileName = document.getElementById("profileName");
    const profileStatus = document.getElementById("profileStatus");
    const profileDot = document.getElementById("profileDot");
    const profileBadges = document.getElementById("profileBadges");
    const avatarBox = document.getElementById("avatarBox");

    const statStudy = document.getElementById("statStudy");
    const statSessions = document.getElementById("statSessions");
    const statMessages = document.getElementById("statMessages");
    const statAchievements = document.getElementById("statAchievements");

    const goalText = document.getElementById("goalText");
    const goalProgress = document.getElementById("goalProgress");
    const goalInput = document.getElementById("goalInput");

    const groupList = document.getElementById("groupList");
    const rankingList = document.getElementById("rankingList");
    const achievementsList = document.getElementById("achievementsList");

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");

    const noteForm = document.getElementById("noteForm");
    const noteInput = document.getElementById("noteInput");
    const notesList = document.getElementById("notesList");

    const helpForm = document.getElementById("helpForm");
    const helpInput = document.getElementById("helpInput");
    const helpList = document.getElementById("helpList");

    loginBtn.addEventListener("click",loginWithGoogle);
    logoutBtn.addEventListener("click",logout);
    continueBtn.addEventListener("click",startSession);
    finishBtn.addEventListener("click",finishSession);
    saveGoalBtn.addEventListener("click",saveDailyGoal);

    async function loginWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://zorjfx.github.io/mySupabaseProject/"
        }
      });

      if (error) {
        alert("Ошибка входа через Google");
        console.error(error);
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function init() {
      const { data,error } = await supabase.auth.getUser();

      if (error || !data.user) {
        loginCard.classList.remove("hidden");
        mainApp.classList.add("hidden");
        return;
      }

      currentUser = data.user;

      const username =
        currentUser.user_metadata.full_name ||
        currentUser.user_metadata.name ||
        currentUser.email;

      const avatarUrl =
        currentUser.user_metadata.avatar_url ||
        "";

      const now = new Date();

      await supabase.from("profiles").upsert({
        id: currentUser.id,
        username: username,
        avatar_url: avatarUrl,
        status: "В сети",
        color: "#35cdb2",
        session_started_at: new Date().toISOString(),
        status_updated_at: new Date().toISOString(),
        last_login_at: new Date().toISOString()
      }, {
        onConflict: "id"
      });

      await loadEverything();
      await checkEarlyBird(now);

      loginCard.classList.add("hidden");
      mainApp.classList.remove("hidden");

      startTimer();
      subscribeRealtime();

      setInterval(loadEverything,5000);
    }

    async function loadEverything() {
      await loadMyProfile();
      await loadAchievements();
      await loadMyLikes();
      await loadGroup();
      await loadRanking();
      await loadMessages();
      await loadStudyNotes();
      await loadHelpRequests();
      renderProfile();
    }

    async function loadMyProfile() {
      const { data,error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();

      if (error) {
        console.error(error);
        return;
      }

      currentProfile = data;
    }

    async function loadAchievements() {
      const { data: achievementsData,error: achievementsError } = await supabase
        .from("achievements")
        .select("*")
        .order("target_value",{ ascending: true });

      if (achievementsError) {
        console.error(achievementsError);
        return;
      }

      allAchievements = achievementsData || [];

      const { data: unlockedData,error: unlockedError } = await supabase
        .from("user_achievements")
        .select("*")
        .eq("user_id",currentUser.id);

      if (unlockedError) {
        console.error(unlockedError);
        return;
      }

      myAchievements = unlockedData || [];
    }

    async function loadMyLikes() {
      const { data,error } = await supabase
        .from("message_likes")
        .select("*")
        .eq("user_id",currentUser.id);

      if (error) {
        console.error(error);
        return;
      }

      myLikes = data || [];
    }

    function renderProfile() {
      if (!currentProfile) return;

      const status = currentProfile.status || "В сети";
      const color = currentProfile.color || "#35cdb2";

      sessionName.textContent = currentProfile.username || "Без имени";
      profileName.textContent = currentProfile.username || "Без имени";

      profileStatus.textContent = status;
      profileStatus.style.color = color;
      profileStatus.classList.add("status-colored");

      sessionStatus.textContent = status;
      sessionStatus.style.color = color;

      if (profileDot) {
        profileDot.style.background = color;
      }

      document.querySelectorAll(".status-btn").forEach(button => {
        button.classList.remove("active");

        if (button.dataset.status === status) {
          button.classList.add("active");
        }
      });

      if (currentProfile.avatar_url && currentProfile.avatar_url.startsWith("http")) {
        avatarBox.innerHTML = `<img src="${escapeHtml(currentProfile.avatar_url)}" alt="avatar">`;
      } else {
        avatarBox.textContent = (currentProfile.username || "A").charAt(0).toUpperCase();
      }

      statStudy.textContent = formatShortTime(currentProfile.total_study_seconds || 0);
      statSessions.textContent = currentProfile.sessions_count || 0;
      statMessages.textContent = currentProfile.messages_count || 0;
      statAchievements.textContent = myAchievements.length;

      const goal = Number(currentProfile.daily_goal_seconds || 7200);
      const studied = Number(currentProfile.total_study_seconds || 0);
      const percent = Math.min(100,Math.round((studied / goal) * 100));

      goalText.textContent = `${formatShortTime(studied)} / ${formatShortTime(goal)} (${percent}%)`;
      goalProgress.style.width = `${percent}%`;

      const unlockedIds = myAchievements.map(item => item.achievement_id);
      const unlocked = allAchievements.filter(item => unlockedIds.includes(item.id));

      profileBadges.innerHTML = unlocked.slice(0,3).map(item => `
        <span class="badge">${escapeHtml(item.emoji || "🏅")} ${escapeHtml(item.title || "Достижение")}</span>
      `).join("");

      renderAchievements();
    }

    async function setStatus(status,color) {
      document.querySelectorAll(".status-btn").forEach(button => {
        button.classList.remove("active");

        if (button.dataset.status === status) {
          button.classList.add("active");
        }
      });

      profileStatus.textContent = status;
      profileStatus.style.color = color;
      sessionStatus.textContent = status;
      sessionStatus.style.color = color;

      if (profileDot) {
        profileDot.style.background = color;
      }

      const { error } = await supabase
        .from("profiles")
        .update({
          status: status,
          color: color,
          status_updated_at: new Date().toISOString()
        })
        .eq("id",currentUser.id);

      if (error) {
        alert("Статус не обновился.Проверь RLS для profiles.");
        console.error(error);
        return;
      }

      await loadEverything();
    }

    window.setStatus = setStatus;

    async function saveDailyGoal() {
      const minutes = Number(goalInput.value);

      if (!minutes || minutes <= 0) {
        alert("Введи цель в минутах.");
        return;
      }

      const seconds = minutes * 60;

      const { error } = await supabase
        .from("profiles")
        .update({
          daily_goal_seconds: seconds
        })
        .eq("id",currentUser.id);

      if (error) {
        alert("Цель не сохранилась.Проверь profiles RLS.");
        console.error(error);
        return;
      }

      goalInput.value = "";
      await loadEverything();
    }

    async function startSession() {
      const { error } = await supabase
        .from("profiles")
        .update({
          status: "В сети",
          color: "#35cdb2",
          session_started_at: new Date().toISOString(),
          status_updated_at: new Date().toISOString()
        })
        .eq("id",currentUser.id);

      if (error) {
        alert("Не удалось начать сессию.");
        console.error(error);
        return;
      }

      await loadEverything();
      startTimer();
    }

    async function finishSession() {
      if (!currentProfile || !currentProfile.session_started_at) return;

      const start = new Date(currentProfile.session_started_at).getTime();
      const now = Date.now();
      const sessionSeconds = Math.max(0,Math.floor((now - start) / 1000));

      const newTotal = Number(currentProfile.total_study_seconds || 0) + sessionSeconds;
      const newSessions = Number(currentProfile.sessions_count || 0) + 1;

      const { error } = await supabase
        .from("profiles")
        .update({
          total_study_seconds: newTotal,
          sessions_count: newSessions,
          session_started_at: null,
          status: "Отошёл",
          color: "#ffb020",
          status_updated_at: new Date().toISOString()
        })
        .eq("id",currentUser.id);

      if (error) {
        alert("Не удалось завершить сессию.");
        console.error(error);
        return;
      }

      await unlockAchievementIfNeeded("first_session");

      if (sessionSeconds >= 7200) {
        await unlockAchievementIfNeeded("marathoner");
      }

      await loadEverything();
    }

    async function checkEarlyBird(date) {
      const hour = date.getHours();

      if (hour < 8) {
        await unlockAchievementIfNeeded("early_bird");
        await loadAchievements();
      }
    }

    async function unlockAchievementIfNeeded(achievementId) {
      const alreadyUnlocked = myAchievements.some(item => item.achievement_id === achievementId);

      if (alreadyUnlocked) return;

      const { error } = await supabase
        .from("user_achievements")
        .insert({
          user_id: currentUser.id,
          achievement_id: achievementId
        });

      if (error) {
        console.error("Achievement error:",error);
      }
    }

    async function loadGroup() {
      const { data,error } = await supabase
        .from("profiles")
        .select("*")
        .order("username",{ ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      groupList.innerHTML = data.map(user => `
        <div class="user-item">
          <div class="dot" style="background:${user.color || "#35cdb2"}"></div>
          <div class="user-main">
            <div class="user-title">${escapeHtml(user.username || "Без имени")}</div>
            <div class="user-sub">
              <span style="color:${user.color || "#35cdb2"};font-weight:900;">
                ${escapeHtml(user.status || "В сети")}
              </span>
              • ${formatShortTime(user.total_study_seconds || 0)}
            </div>
          </div>
          <div class="user-sub">${user.sessions_count || 0} сесс.</div>
        </div>
      `).join("");
    }

    async function loadRanking() {
      const { data,error } = await supabase
        .from("profiles")
        .select("*")
        .order("total_study_seconds",{ ascending: false })
        .limit(10);

      if (error) {
        console.error(error);
        return;
      }

      rankingList.innerHTML = data.map((user,index) => `
        <div class="rank-item">
          <div class="place">${index + 1}</div>
          <div class="rank-main">
            <div class="rank-title">${rankEmoji(index)} ${escapeHtml(user.username || "Без имени")}</div>
            <div class="rank-sub">${user.sessions_count || 0} сессий • ${user.messages_count || 0} сообщ.</div>
          </div>
          <div class="rank-score">${formatShortTime(user.total_study_seconds || 0)}</div>
        </div>
      `).join("");
    }

    function renderAchievements() {
      const unlockedIds = myAchievements.map(item => item.achievement_id);

      achievementsList.innerHTML = allAchievements.map(item => {
        const unlocked = unlockedIds.includes(item.id);

        return `
          <div class="achievement ${unlocked ? "" : "locked"}">
            <div class="ach-emoji">${escapeHtml(item.emoji || "🏅")}</div>
            <div class="ach-title">${escapeHtml(item.title || "Достижение")}</div>
            <div class="ach-desc">${escapeHtml(item.description || "Описание не добавлено")}</div>
            <span class="rarity">${unlocked ? escapeHtml(item.rarity || "common") : "закрыто"}</span>
          </div>
        `;
      }).join("");
    }

    chatForm.addEventListener("submit",async event => {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      const { error } = await supabase.from("messages").insert({
        user_id: currentUser.id,
        username: currentProfile.username,
        text: text,
        likes_count: 0
      });

      if (error) {
        alert("Сообщение не отправлено.Проверь таблицу messages.");
        console.error(error);
        return;
      }

      const newCount = Number(currentProfile.messages_count || 0) + 1;

      await supabase
        .from("profiles")
        .update({
          messages_count: newCount
        })
        .eq("id",currentUser.id);

      if (newCount >= 20) {
        await unlockAchievementIfNeeded("activist");
      }

      messageInput.value = "";
      await loadEverything();
    });

    async function loadMessages() {
      const { data,error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at",{ ascending: true })
        .limit(50);

      if (error) {
        console.error(error);
        return;
      }

      chatBox.innerHTML = data.map(message => {
        const liked = myLikes.some(like => Number(like.message_id) === Number(message.id));

        return `
          <div class="message">
            <div>
              <strong>${escapeHtml(message.username)}:</strong>
              ${escapeHtml(message.text)}
            </div>
            <button class="like-btn" onclick="toggleMessageLike(${message.id},${message.likes_count || 0})">
              ${liked ? "💚" : "👍"} ${message.likes_count || 0}
            </button>
          </div>
        `;
      }).join("");

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function toggleMessageLike(messageId,currentLikes) {
      const existingLike = myLikes.find(like => Number(like.message_id) === Number(messageId));

      if (existingLike) {
        const { error: deleteError } = await supabase
          .from("message_likes")
          .delete()
          .eq("id",existingLike.id);

        if (deleteError) {
          alert("Лайк не удалился.");
          console.error(deleteError);
          return;
        }

        await supabase
          .from("messages")
          .update({
            likes_count: Math.max(0,Number(currentLikes) - 1)
          })
          .eq("id",messageId);
      } else {
        const { error: insertError } = await supabase
          .from("message_likes")
          .insert({
            message_id: messageId,
            user_id: currentUser.id
          });

        if (insertError) {
          alert("Лайк не поставился.");
          console.error(insertError);
          return;
        }

        await supabase
          .from("messages")
          .update({
            likes_count: Number(currentLikes) + 1
          })
          .eq("id",messageId);
      }

      await loadEverything();
    }

    window.toggleMessageLike = toggleMessageLike;

    noteForm.addEventListener("submit",async event => {
      event.preventDefault();

      const note = noteInput.value.trim();
      if (!note) return;

      await createStudyNote(note);
    });

    async function createStudyNote(note) {
      const { error } = await supabase
        .from("study_notes")
        .insert({
          user_id: currentUser.id,
          username: currentProfile.username,
          note: note
        });

      if (error) {
        alert("Заметка не сохранилась.Проверь study_notes RLS.");
        console.error(error);
        return;
      }

      noteInput.value = "";
      await loadStudyNotes();
    }

    async function loadStudyNotes() {
      const { data,error } = await supabase
        .from("study_notes")
        .select("*")
        .order("created_at",{ ascending: false })
        .limit(5);

      if (error) {
        console.error(error);
        return;
      }

      notesList.innerHTML = data.map(item => `
        <div class="note-item">
          <div class="note-title">${escapeHtml(item.username)}</div>
          <div class="note-sub">${escapeHtml(item.note)}</div>
        </div>
      `).join("");
    }

    helpForm.addEventListener("submit",async event => {
      event.preventDefault();

      const question = helpInput.value.trim();
      if (!question) return;

      await createHelpRequest(question);
    });

    async function createHelpRequest(question) {
      const { error } = await supabase
        .from("help_requests")
        .insert({
          user_id: currentUser.id,
          username: currentProfile.username,
          question: question,
          is_resolved: false
        });

      if (error) {
        alert("Запрос помощи не сохранился.Проверь help_requests RLS.");
        console.error(error);
        return;
      }

      helpInput.value = "";
      await loadHelpRequests();
    }

    async function loadHelpRequests() {
      const { data,error } = await supabase
        .from("help_requests")
        .select("*")
        .eq("is_resolved",false)
        .order("created_at",{ ascending: false })
        .limit(5);

      if (error) {
        console.error(error);
        return;
      }

      helpList.innerHTML = data.map(item => `
        <div class="help-item">
          <div class="help-title">🆘 ${escapeHtml(item.username)}</div>
          <div class="help-sub">${escapeHtml(item.question)}</div>
          ${
            item.user_id === currentUser.id
              ? `<button class="like-btn" onclick="resolveHelpRequest(${item.id})">Закрыть</button>`
              : ""
          }
        </div>
      `).join("");
    }

    async function resolveHelpRequest(id) {
      const { error } = await supabase
        .from("help_requests")
        .update({
          is_resolved: true
        })
        .eq("id",id);

      if (error) {
        alert("Не удалось закрыть запрос.");
        console.error(error);
        return;
      }

      await loadHelpRequests();
    }

    window.resolveHelpRequest = resolveHelpRequest;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (!currentProfile || !currentProfile.session_started_at) {
          timerText.textContent = "0 сек.";
          return;
        }

        const start = new Date(currentProfile.session_started_at).getTime();
        const now = Date.now();
        const seconds = Math.max(0,Math.floor((now - start) / 1000));

        timerText.textContent = formatTime(seconds);
      },1000);
    }

    function showTab(tab) {
      document.getElementById("participantsTab").classList.add("hidden");
      document.getElementById("rankingTab").classList.add("hidden");
      document.getElementById("achievementsTab").classList.add("hidden");

      document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));

      if (tab === "participants") {
        document.getElementById("participantsTab").classList.remove("hidden");
        document.querySelectorAll(".tab")[0].classList.add("active");
      }

      if (tab === "ranking") {
        document.getElementById("rankingTab").classList.remove("hidden");
        document.querySelectorAll(".tab")[1].classList.add("active");
      }

      if (tab === "achievements") {
        document.getElementById("achievementsTab").classList.remove("hidden");
        document.querySelectorAll(".tab")[2].classList.add("active");
      }
    }

    window.showTab = showTab;

    function subscribeRealtime() {
      supabase
        .channel("main-realtime")
        .on("postgres_changes",{ event: "*",schema: "public",table: "profiles" },loadEverything)
        .on("postgres_changes",{ event: "*",schema: "public",table: "messages" },loadEverything)
        .on("postgres_changes",{ event: "*",schema: "public",table: "user_achievements" },loadEverything)
        .on("postgres_changes",{ event: "*",schema: "public",table: "study_notes" },loadEverything)
        .on("postgres_changes",{ event: "*",schema: "public",table: "help_requests" },loadEverything)
        .subscribe();
    }

    function rankEmoji(index) {
      if (index === 0) return "🥇";
      if (index === 1) return "🥈";
      if (index === 2) return "🥉";
      return "⭐";
    }

    function formatTime(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;

      if (h > 0) return `${h}ч ${m}м ${s}с`;
      if (m > 0) return `${m}м ${s}с`;
      return `${s} сек.`;
    }

    function formatShortTime(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;

      if (h > 0) return `${h}ч ${m}м`;
      if (m > 0) return `${m}м ${s}с`;
      return `${s}с`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    init();
  </script>
</body>
</html>
